<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>html é um bagulho chato</title>
</head>
<body style="margin: 0; min-height: 100vh; background-image: url('wood.jpg'); background-size: cover; background-repeat: no-repeat; background-position: center;">

  <div style="display: flex; justify-content: center; align-items: center; min-height: 100vh;">
    <div style="display: flex; align-items: center;">
      <div style="display: flex; flex-direction: column; gap: 10px; margin-right: 20px;">
        <button type="button" onclick="playAudio('audio1')" style="background: transparent; border: none; padding: 0; width: 50px; height: 50px;"><img src="botaov.png" alt="Play Track 1" style="width: 100%; height: auto; display: block;"></button>
        <button type="button" onclick="playAudio('audio2')" style="background: transparent; border: none; padding: 0; width: 50px; height: 50px;"><img src="botaov.png" alt="Play Track 2" style="width: 100%; height: auto; display: block;"></button>
        <button type="button" onclick="playAudio('audio3')" style="background: transparent; border: none; padding: 0; width: 50px; height: 50px;"><img src="botaov.png" alt="Play Track 3" style="width: 100%; height: auto; display: block;"></button>
        <button type="button" onclick="playAudio('audio4')" style="background: transparent; border: none; padding: 0; width: 50px; height: 50px;"><img src="botaov.png" alt="Play Track 4" style="width: 100%; height: auto; display: block;"></button>
        <button type="button" onclick="playAudio('audio5')" style="background: transparent; border: none; padding: 0; width: 50px; height: 50px;"><img src="botaov.png" alt="Play Track 5" style="width: 100%; height: auto; display: block;"></button>
      </div>
      <img src="imageegami.jpg" alt="Placeholder" style="max-width: 320px; width: 100%; height: auto; display: block;">
    </div>
  </div>

  <audio id="audio1" src="aud1.mp3"></audio>
  <audio id="audio2" src="aud2.mp3"></audio>
  <audio id="audio3" src="aud3.mp3"></audio>
  <audio id="audio4" src="aud4.mp3"></audio>
  <audio id="audio5" src="aud5.mp3"></audio>


  <script>
    function playAudio(id) {
      var audio = document.getElementById(id);
      if (audio) {
        audio.currentTime = 0;
        audio.play();
      }
    }
  </script>
</body>
</html>
